<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu jogo</title>

    <meta property="og:title" content="Meu jogo">
    <meta property="og:description" content="">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffeef3;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .caixa {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.5;
        }

        button {
            border: none;
            background: #ffb6c8;
            padding: 13px 20px;
            margin: 7px;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.06);
            background: #ff9fba;
        }

        .grade {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .grade button {
            width: 100%;
            height: 65px;
            margin: 0;
            font-size: 24px;
        }

        .coracao {
            font-size: 70px;
            background: none;
            padding: 10px;
        }

        .assinatura {
            position: fixed;
            bottom: 8px;
            right: 10px;
            font-size: 11px;
            color: #b47a88;
            z-index: 5;
        }

        .coracao-caindo {
            position: fixed;
            top: -30px;
            font-size: 20px;
            animation: cair 4s linear forwards;
            z-index: 1;
        }

        @keyframes cair {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(110vh);
            }
        }
    </style>
</head>

<body>

    <div class="caixa" id="jogo">

        <h1>Ei...</h1>

        <p>
            Eu fiz uma coisinha aqui.<br>
            Não é nada demais kkk
        </p>

        <p>Quer ver?</p>

        <button onclick="comecar()">sim ❤️</button>
        <button onclick="comecar()">claro 💕</button>

    </div>

    <div class="assinatura">
        feito com carinho para carla ❤️
    </div>

    <script>

        let cliques = 0;

        const emojis = ["❤️", "😂", "👀", "💗", "😳"];

        function comecar() {

            document.getElementById("jogo").innerHTML = `
                <h1>Tá...</h1>

                <p>Agora clica em algum botão.</p>

                <p>Só não vale reclamar depois</p>

                <div class="grade" id="grade"></div>
            `;

            criarBotoes();
        }

        function criarBotoes() {

            const grade = document.getElementById("grade");

            for (let i = 0; i < 9; i++) {

                const botao = document.createElement("button");

                botao.innerText = "?";

                botao.onclick = function () {

                    if (botao.innerText === "?") {

                        botao.innerText =
                            emojis[Math.floor(Math.random() * emojis.length)];

                        cliques++;

                        if (cliques >= 3) {

                            setTimeout(segundoJogo, 500);

                        }
                    }
                };

                grade.appendChild(botao);
            }
        }

        function segundoJogo() {

            cliques = 0;

            document.getElementById("jogo").innerHTML = `
                <h1>Tá ficando interessante...</h1>

                <p>Agora clica no coração</p>

                <button class="coracao" onclick="clicarCoracao()">❤️</button>

                <p id="contador"></p>
            `;
        }

        function clicarCoracao() {

            cliques++;

            const contador = document.getElementById("contador");

            if (cliques === 1) {

                contador.innerText = "Mais uma vez";

            } else if (cliques === 2) {

                contador.innerText = "Mais uma...";

            } else if (cliques === 3) {

                contador.innerText = "Agora foi";

                setTimeout(ultimaParte, 700);
            }
        }

        function ultimaParte() {

            document.getElementById("jogo").innerHTML = `
                <h1>Última coisa.</h1>

                <p>Prometo.</p>

                <p>Clica aqui:</p>

                <button onclick="finalizar()">aqui</button>
            `;
        }

        function finalizar() {

            document.getElementById("jogo").innerHTML = `
                <div style="font-size:70px;">❤️</div>

                <h1>Pronto.</h1>

                <p>
                    Era só uma desculpa pra fazer você
                    ficar aqui mais um pouquinho.
                </p>

                <p>
                    Eu gosto muito de você, meu amor ❤️
                </p>

                <p>
                    fiz isso pensando em você
                </p>
            `;

            coracoes();
        }

        function coracoes() {

            for (let i = 0; i < 25; i++) {

                setTimeout(() => {

                    const coracao = document.createElement("div");

                    coracao.className = "coracao-caindo";

                    coracao.innerText = "❤️";

                    coracao.style.left =
                        Math.random() * 100 + "vw";

                    coracao.style.animationDuration =
                        (3 + Math.random() * 3) + "s";

                    document.body.appendChild(coracao);

                    setTimeout(() => {
                        coracao.remove();
                    }, 6000);

                }, i * 150);
            }
        }

    </script>

</body>

</html>
